# Blueprint de Render: sitio estático (SPA) servido desde dist/.
services:
  - type: web
    name: til-tracker
    runtime: static
    buildCommand: npm ci && npm test && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://til-backend.onrender.com/api/v1
    routes:
      # Rewrite SPA: cualquier ruta devuelve index.html (el router es del cliente).
      - type: rewrite
        source: /*
        destination: /index.html
    # Cabeceras de seguridad aplicadas a todas las respuestas.
    headers:
      - path: /*
        name: Content-Security-Policy
        # Solo scripts propios; XHR únicamente al backend; imágenes https (enlaces GPS);
        # sin iframes, sin <object>, sin cambiar <base>, formularios solo al mismo origen.
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data:; connect-src 'self' https://til-backend.onrender.com; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Permissions-Policy
        value: geolocation=(), camera=(), microphone=()
